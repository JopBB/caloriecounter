<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — daily calorie tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"> 
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Sign-in screen. Both this and the app below start hidden; app.js reveals
     exactly one of them once Firebase has reported whether you are signed in.
     That avoids a flash of the app before the check finishes. -->
<div class="signin" id="signinScreen" style="display:none;">
  <form class="signin-card" id="signinForm">
    <h1>Ledger</h1>
    <p class="signin-hint">Sign in to reach your data.</p>
    <input type="email" id="signinEmail" placeholder="Email" autocomplete="username" required>
    <input type="password" id="signinPassword" placeholder="Password" autocomplete="current-password" required>
    <button class="btn" type="submit" id="signinBtn">Sign in</button>
    <p class="signin-error" id="signinError"></p>
  </form>
</div>

<div class="wrap" id="appWrap" style="display:none;">

  <header>
    <h1>Ledger</h1>
    <div class="date-nav">
      <button id="prevDay" aria-label="Previous day">←</button>
      <span id="dateLabel">Today</span>
      <button id="nextDay" aria-label="Next day">→</button>
      <button class="today-link" id="jumpToday" style="display:none;">today</button>
    </div>
  </header>

  <div class="totalcard">
    <div class="big">
      <span class="num" id="totalNum">0</span>
      <span class="unit" id="totalUnit">kcal today</span>
    </div>
    <div class="barwrap"><div class="bar" id="progressBar" style="width:0%"></div></div>
    <div class="target-row">
      <span id="remainingLabel">Set a daily target to see what's left</span>
      <button class="edit-target" id="editTargetBtn">set target</button>
    </div>
  </div>

  <section class="block">
    <h2>Search foods</h2>
    <div class="searchbox">
      <input type="text" id="searchInput" placeholder="Search a food or product…">
    </div>
    <div class="results" id="searchResults" style="display:none;"></div>
    <div class="searchmeta" id="searchMeta"></div>
  </section>

  <section class="block">
    <h2>Today's log</h2>
    <div class="entry-list" id="entryList">
      <div class="empty">Nothing logged yet.</div>
    </div>
  </section>

  <section class="block">
    <h2>Weight</h2>
    <div class="weightrow">
      <!-- Text, not number: a number input rejects "88.3" outright in some
           locales and hands back an empty string. app.js parses it instead. -->
      <input type="text" inputmode="decimal" id="weightInput" placeholder="0.0"
             aria-label="Weight in kilograms">
      <span class="weight-unit">kg</span>
      <button class="btn secondary" id="addWeightBtn">Log weight</button>
    </div>
    <div class="chartbox" id="chartBox"></div>
    <div class="weight-history" id="weightHistory"></div>
  </section>

  <footer>
    <span id="signedInAs"></span>
    Food data via Open Food Facts
    <button class="signout-link" id="signOutBtn" style="display:none;">sign out</button>
  </footer>
</div>

<!-- Add / edit entry modal. Hidden until app.js opens it.
     One modal, two modes:
       gram mode    — you type an amount, the calories are computed from the
                      product's per-100g rate and shown live.
       calorie mode — you type the calories directly. Used by the + button on
                      each meal, and by products with no per-100g figure. -->
<div class="modal-backdrop" id="entryModal" style="display:none;">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="entryModalTitle">
    <h2 class="modal-title" id="entryModalTitle">Add food</h2>

    <!-- Only shown when adding by hand from a meal's + button, and only for
         that meal. Built in app.js from the stored favourites. -->
    <div id="favoritesField" hidden>
      <span class="modal-label">Favourites</span>
      <div class="favorites-list" id="favoritesList"></div>
    </div>

    <label class="modal-label" for="entryName">Name</label>
    <input type="text" id="entryName" placeholder="What is it?">

    <!-- Buttons are built from the MEALS constant in app.js, so the four meal
         names are spelled out in exactly one place. -->
    <div id="mealPickerField">
      <span class="modal-label" id="mealPickerLabel">Meal</span>
      <div class="meal-picker" id="mealPicker" role="group" aria-labelledby="mealPickerLabel"></div>
    </div>

    <div id="gramFields" hidden>
      <label class="modal-label" for="entryGrams">Amount</label>
      <div class="amount-row">
        <input type="number" id="entryGrams" min="0" step="1" placeholder="100">
        <span class="amount-unit">g</span>
      </div>
      <p class="calorie-preview" id="caloriePreview">—</p>
    </div>

    <div id="calorieFields" hidden>
      <label class="modal-label" for="entryCalories">Calories</label>
      <div class="amount-row">
        <input type="number" id="entryCalories" min="0" step="1" placeholder="0">
        <span class="amount-unit">kcal</span>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn secondary" id="entryCancelBtn" type="button">Cancel</button>
      <button class="btn" id="entrySaveBtn" type="button">Save</button>
    </div>
  </div>
</div>

<!-- Firebase (loaded from Google's CDN). Remove these three lines and the app
     falls back to this browser's local storage, with no sign-in. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
